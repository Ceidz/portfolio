<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cedric · Web & App Developer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;600&display=swap">
<style>
:root{--bg:#eceff7;--fg:#12162b;--mute:#566080;--line:#c4cadf;--hd:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;--bd:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0f1e;--fg:#eceffa;--mute:#97a0bf;--line:#262c47}}
:root[data-theme="dark"]{--bg:#0c0f1e;--fg:#eceffa;--mute:#97a0bf;--line:#262c47}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.6 var(--bd);overflow-x:clip}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:9}
a{color:inherit}
:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
.wrap{max-width:980px;margin:0 auto;padding:0 20px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--bg)}
nav .wrap{display:flex;justify-content:space-between;align-items:center;height:58px}
nav .l{display:flex;gap:18px;align-items:center;font-size:15px}
nav .l a{text-decoration:none;color:var(--mute)}
nav .l a:hover{color:var(--fg)}
nav b{font:800 18px var(--hd)}
#theme{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--fg);background:none;color:var(--fg);cursor:pointer;font-size:14px}
@media(max-width:520px){nav .l .x{display:none}}
.hero{padding:40px 0 20px}
h1{font:800 clamp(72px,26vw,260px)/.86 var(--hd);letter-spacing:-.045em;margin:0 0 28px;display:flex;overflow:hidden;padding-bottom:.06em}
h1 span{display:inline-block;transform:translateY(105%);animation:up .8s cubic-bezier(.2,.9,.2,1) forwards;animation-delay:calc(var(--i)*70ms)}
@keyframes up{to{transform:none}}
.role{font:500 clamp(24px,5.5vw,40px)/1.15 var(--hd);margin:0 0 14px;letter-spacing:-.01em}
.pitch{max-width:44ch;color:var(--mute);margin:0 0 24px}
.status{display:inline-flex;gap:10px;align-items:center;font-size:15px;margin-bottom:28px}
.status i{width:10px;height:10px;border-radius:50%;background:#2fbf71;box-shadow:0 0 0 4px #2fbf7133}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{padding:13px 22px;border-radius:999px;border:1.5px solid var(--fg);text-decoration:none;font-weight:600;font-size:16px}
.btn.f{background:var(--fg);color:var(--bg)}
.sec{padding-top:88px}
h2{font:800 clamp(30px,6vw,44px)/1 var(--hd);letter-spacing:-.02em;margin:0 0 28px}
.row{display:grid;gap:12px;padding:28px 20px;margin:0 -20px;border-top:1px solid var(--line);text-decoration:none;color:var(--fg);transition:background .25s,color .25s}
.row:last-child{border-bottom:1px solid var(--line)}
.row:hover,.row:focus-visible,.row:active{background:var(--c);color:var(--ink);outline-offset:-3px}
.row h3{font:800 clamp(36px,9vw,76px)/.98 var(--hd);letter-spacing:-.03em;margin:0}
.row p{margin:0;font-size:16px}
.row .m{font-size:14px;opacity:.75;margin-top:8px}
.row .go{font-weight:600;font-size:15px;text-decoration:underline;text-underline-offset:4px}
@media(min-width:760px){.row{grid-template-columns:1.25fr 1fr;align-items:end;gap:36px;padding:38px 28px;margin:0 -28px}}
.tools{display:grid;gap:0 48px}
.tools div{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0;border-top:1px solid var(--line)}
.tools b{font:800 24px var(--hd);letter-spacing:-.01em}
.tools span{color:var(--mute);font-size:15px;text-align:right}
@media(min-width:760px){.tools{grid-template-columns:1fr 1fr}}
.about{display:grid;gap:8px 48px}
.about p{margin:0 0 14px;max-width:56ch;color:var(--mute)}
.about p:first-child{color:var(--fg);font-size:20px;line-height:1.5}
@media(min-width:760px){.about{grid-template-columns:1fr 1.4fr}}
.say{font:800 clamp(34px,10vw,96px)/1 var(--hd);letter-spacing:-.035em;word-break:break-word;text-decoration:underline;text-decoration-thickness:.06em;text-underline-offset:.12em;display:inline-block;margin:6px 0 30px}
footer{padding:96px 0 56px}
.on{margin-top:48px;padding-top:20px;border-top:1px solid var(--line);color:var(--mute);font-size:14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media(prefers-reduced-motion:reduce){h1 span{animation:none;transform:none}html{scroll-behavior:auto}.row{transition:none}}
:root{--gl:#ffffff66;--gb:#ffffffaa}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--gl:#ffffff12;--gb:#ffffff24}}
:root[data-theme="dark"]{--gl:#ffffff12;--gb:#ffffff24}
body{background:radial-gradient(40% 35% at 15% 10%,#ff7ab866,transparent),radial-gradient(45% 40% at 90% 30%,#6f5bff66,transparent),radial-gradient(50% 40% at 30% 85%,#38d5c166,transparent),var(--bg);background-attachment:fixed;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
nav,body::before{background:var(--gl);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
nav{border-bottom:1px solid var(--gb)}
.row{background:var(--gl);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--gb);border-radius:24px;margin:0 0 16px}
.row:last-child{border:1px solid var(--gb)}
.tools{gap:0 16px}
.tools div{background:var(--gl);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--gb);border-radius:16px;padding:14px 18px;margin-bottom:12px}
.about{background:var(--gl);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--gb);border-radius:24px;padding:26px 22px}
.btn{background:var(--gl);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-color:var(--gb)}
#theme{background:var(--gl);border-color:var(--gb)}
.ic{width:54px;height:54px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.ic svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
*{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
::selection{background:transparent}
a,button{-webkit-touch-callout:none;outline:none}
a:focus-visible,button:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
.row{display:block;padding:0;overflow:hidden;transition:background .25s,color .25s,transform .15s}
.row:hover,.row:focus-visible,.row:active{background:var(--gl);color:var(--fg)}
@media(hover:hover){.row:hover{background:var(--c);color:var(--ink)}}
.row.open{background:var(--c);color:var(--ink)}
.row:active{transform:scale(.99)}
.hd{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;align-items:center;gap:16px;width:100%;padding:24px 22px;cursor:pointer}
.hd:focus-visible{outline:3px solid currentColor;outline-offset:-4px;border-radius:24px}
.tt,.row .m{display:block}
.chev{font:500 32px/1 var(--hd);width:44px;height:44px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;flex:none;transition:transform .3s}
.row.open .chev{transform:rotate(45deg)}
.bd{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.row.open .bd{grid-template-rows:1fr}
.in{overflow:hidden;padding:0 22px}
.row.open .in{padding-bottom:26px}
.in p{margin:0 0 12px;max-width:58ch}
.in ul{margin:0 0 16px;padding-left:20px}
.in li{margin-bottom:4px}
.tg{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.tg span{font-size:13px;padding:4px 12px;border-radius:999px;border:1px solid currentColor;opacity:.85}
#pg{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,#ff7ab8,#6f5bff,#38d5c1);z-index:10}
nav .l a{white-space:nowrap}
nav .l a.cur{color:var(--fg)}
:root{--gl:linear-gradient(135deg,#ffffff99,#ffffff44);--gb:#ffffffcc;--sh:0 10px 34px #3b2a6a2e,inset 0 1px 0 #ffffffcc,inset 0 -1px 0 #ffffff55}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--gl:linear-gradient(135deg,#ffffff24,#ffffff08);--gb:#ffffff2e;--sh:0 12px 36px #00000066,inset 0 1px 0 #ffffff33,inset 0 -1px 0 #ffffff10}}
:root[data-theme="dark"]{--gl:linear-gradient(135deg,#ffffff24,#ffffff08);--gb:#ffffff2e;--sh:0 12px 36px #00000066,inset 0 1px 0 #ffffff33,inset 0 -1px 0 #ffffff10}
body{background:var(--bg)}
html::before{content:"";position:fixed;inset:-25%;z-index:-1;pointer-events:none;opacity:.5;background:radial-gradient(34% 30% at 20% 22%,#ff6fb3,transparent 70%),radial-gradient(36% 32% at 80% 30%,#7a62ff,transparent 70%),radial-gradient(40% 34% at 35% 82%,#2fd6c0,transparent 70%),radial-gradient(28% 26% at 85% 85%,#ffb86b,transparent 70%);animation:drift 40s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(4%,-3%) rotate(8deg) scale(1.08)}}
.row,.tools div,.about,.btn,nav,#theme{backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);box-shadow:var(--sh)}
nav{border-bottom:1px solid var(--gb)}
.row.open{background:color-mix(in srgb,var(--c) 90%,transparent)}
@media(prefers-reduced-motion:reduce){html::before{animation:none}}
@media(min-width:1100px){.wrap{max-width:1080px}}
@media(max-width:760px){.on{flex-direction:column}}
@media(max-width:380px){body{font-size:16px}.hd{padding:20px 16px}.in{padding:0 16px}.row.open .in{padding-bottom:20px}.about{padding:20px 16px}.ic{width:48px;height:48px}.btns{gap:10px}.tools div{padding:12px 14px}}
.ph{width:150px;aspect-ratio:1;border-radius:28px;overflow:hidden;display:grid;place-items:center;background:var(--gl);border:1px solid var(--gb);box-shadow:var(--sh);color:var(--mute);margin-bottom:8px}
.ph svg{width:48%;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round}
.ph img{width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
@media(min-width:760px){.about{grid-template-columns:220px 1fr;align-items:center;gap:36px}.ph{width:220px;margin:0}}
html::before{animation:none;inset:0}
.row,.tools div,.about,.btn,#theme{backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
nav,body::before{backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
</style>
</head>
<body>
<div id="pg"></div><nav><div class="wrap"><b id="logo"></b><div class="l"><a class="x" href="#work">Work</a><a class="x" href="#tools">Tools</a><a href="#about">About</a><a href="#contact">Contact</a><button id="theme" aria-label="Switch light or dark theme">◐</button></div></div></nav>
<div class="wrap">
<header class="hero">
<h1 id="name" aria-label="Cedric"></h1>
<p class="role" id="role"></p>
<p class="pitch" id="pitch"></p>
<div class="status"><i></i><span id="status"></span></div>
<div class="btns"><a class="btn f" href="#work">See my work</a><a class="btn ic" id="mail" href="#" aria-label="Email (link coming soon)"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></a></div>
</header>
<section class="sec" id="work"><h2>Selected work</h2><div id="rows"></div></section>
<section class="sec" id="tools"><h2>Tools I use</h2><div class="tools" id="tl"></div></section>
<section class="sec" id="about"><h2>About</h2><div class="about" id="ab"></div></section>
</div>
<footer id="contact"><div class="wrap">
<h2>Let’s build something</h2>
<div class="btns" id="cb"></div>
<div class="on"><span id="song"></span><span id="copy"></span></div>
</div></footer>
<script>
const ME={
  name:"Cedric",
  photo:"", // image URL or data:image base64
  social:{Gmail:"cedricnashanti@gmail.com",Facebook:"https://www.facebook.com/cedric.13208",Instagram:"https://www.instagram.com/cediboyyy_?dlrf=amU4bjE1NmVwY2d5",Telegram:"t.me/picklebooze"},
  role:"Web & app developer",                                                                                                                                                                                            
  status:"Open to internships",
  pitch:"I build fast, polished web apps with HTML, CSS, and JavaScript, and I write Java and C++ for everything beyond the browser.",
  about:[
    "I turn ideas into things people can tap, play, and use.",
    "My projects so far: an encrypted vault, a QR code studio, a mobile dungeon game, and a login flow with a live password meter. Each one taught me something I use in the next.",
    "Away from the screen, I’m usually listening to music, which is why a lot of my side projects end up with sound or rhythm in them."
  ],
  projects:[
    {t:"Vault Nexus",hl:["Local-only or cloud-synced storage","PIN unlock","Backup and restore your data"],k:"Encrypted notes, passwords, and files",d:"Store everything on your device or sync it to the cloud. A PIN unlocks the vault, and you can back up and restore your data.",tags:"JavaScript, Firebase Auth, Encryption",live:"https://vault-nexus.vercel.app/",c:"#c9f2e3",ink:"#08261c"},
    {t:"QR Studio",hl:["Codes for links, WiFi, and text","Custom patterns, colors, and logo","Export up to 4000px, or download as SVG","Scan with the camera or from an image"],k:"QR code generator and scanner",d:"Make codes for links, WiFi, and text, style them with your own colors and logo, then export up to 4000px. Scan codes with the camera or an image.",tags:"JavaScript, Camera API, SVG",live:"https://qr-code-cei.vercel.app/",c:"#ffe27a",ink:"#2b2100"},
    {t:"Realm of Etherion",hl:["Built for phones and runs full screen","Playable straight from the browser"],k:"Fantasy dungeon game for mobile",d:"A full-screen dungeon crawler that runs like an installed app on your phone.",tags:"JavaScript, Game development, Mobile",live:"https://dungeon-delta-three.vercel.app/",c:"#c1121f",ink:"#ffffff"},
    {t:"NextGen Auth",hl:["Login and sign-up on one screen","Live password strength meter","Confirm-password check"],k:"Login and sign-up flow",d:"A clean sign-in screen with a live password strength meter and a confirm-password check.",tags:"HTML, CSS, JavaScript",live:"https://login-project-ced.vercel.app/",c:"#6f5bff",ink:"#ffffff"}
  ],
  tools:[["HTML","Comfortable"],["CSS","Comfortable"],["JavaScript","Building with it"],["Java","Solid basics"],["C++","Solid basics"]],
};
const $=s=>document.querySelector(s),el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x)e.textContent=x;return e};
document.title=ME.name+" · "+ME.role;
$("#logo").textContent=ME.name;
[...ME.name].forEach((ch,i)=>{const s=el("span","",ch);s.style.setProperty("--i",i);s.setAttribute("aria-hidden","true");$("#name").appendChild(s)});
$("#name").setAttribute("aria-label",ME.name);
$("#role").textContent=ME.role;$("#pitch").textContent=ME.pitch;$("#status").textContent=ME.status;
$("#song").textContent=ME.song;$("#copy").textContent="© "+new Date().getFullYear()+" "+ME.name;
ME.projects.forEach(p=>{
  const a=el("article","row");a.style.setProperty("--c",p.c);a.style.setProperty("--ink",p.ink);
  const h=el("button","hd");h.setAttribute("aria-expanded","false");
  const l=el("span","tt");l.append(el("h3","",p.t),el("span","m",p.k));
  h.append(l,el("span","chev","+"));
  const b=el("div","bd"),w=el("div","in");
  w.append(el("p","",p.d));
  const u=el("ul");p.hl.forEach(x=>u.appendChild(el("li","",x)));w.appendChild(u);
  const tg=el("div","tg");p.tags.split(", ").forEach(t=>tg.appendChild(el("span","",t)));w.appendChild(tg);
  const go=el("a","btn f","Open live site");go.href=p.live;go.target="_blank";go.rel="noopener";w.appendChild(go);
  b.appendChild(w);a.append(h,b);$("#rows").appendChild(a);
  h.onclick=()=>{document.querySelectorAll(".row.open").forEach(x=>{if(x!==a){x.classList.remove("open");x.querySelector(".hd").setAttribute("aria-expanded","false")}});const o=a.classList.toggle("open");h.setAttribute("aria-expanded",o)};
});
ME.tools.forEach(([n,l])=>{const d=el("div");d.append(el("b","",n),el("span","",l));$("#tl").appendChild(d)});
const ph=el("div","ph");if(ME.photo){const im=el("img");im.src=ME.photo;im.alt=ME.name;ph.appendChild(im)}else ph.innerHTML='<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>';
const tx=el("div");ME.about.forEach(t=>tx.appendChild(el("p","",t)));$("#ab").append(ph,tx);
const IC={Gmail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',Facebook:'<path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>',Instagram:'<rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.4a4 4 0 1 1-7.9 1.2 4 4 0 0 1 7.9-1.2z"/><path d="M17.5 6.5h.01"/>',Telegram:'<path d="M22 2 11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/>',Email:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',GitHub:'<path d="M9 19c-4 1.2-4-2-6-2.5m12 4.5v-3.1a2.7 2.7 0 0 0-.8-2.1c2.7-.3 5.5-1.3 5.5-6a4.7 4.7 0 0 0-1.3-3.3 4.4 4.4 0 0 0-.1-3.3s-1-.3-3.4 1.3a11.6 11.6 0 0 0-6 0C6.5 2.9 5.5 3.2 5.5 3.2a4.4 4.4 0 0 0-.1 3.3A4.7 4.7 0 0 0 4 9.8c0 4.7 2.8 5.7 5.5 6a2.7 2.7 0 0 0-.8 2.1V21"/>',LinkedIn:'<path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/>'};
["Gmail","Facebook","Instagram","Telegram"].forEach(n=>{const a=el("a","btn ic");const u=ME.social[n];a.href=u||"#";if(u){a.target="_blank";a.rel="noopener"}else a.onclick=e=>e.preventDefault();a.setAttribute("aria-label",n);a.innerHTML='<svg viewBox="0 0 24 24">'+IC[n]+'</svg>';$("#cb").appendChild(a)});
["copy","cut","contextmenu","selectstart","dragstart"].forEach(e=>document.addEventListener(e,x=>x.preventDefault()));
addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&"cxa".includes(e.key.toLowerCase()))e.preventDefault()});
const secs=[...document.querySelectorAll("section,footer")],nl=[...document.querySelectorAll("nav .l a")];
addEventListener("scroll",()=>{const h=document.documentElement;$("#pg").style.width=(scrollY/Math.max(1,h.scrollHeight-innerHeight)*100)+"%";let c="";secs.forEach(s=>{if(s.getBoundingClientRect().top<innerHeight*.4)c=s.id});nl.forEach(a=>a.classList.toggle("cur",a.getAttribute("href")==="#"+c))},{passive:true});
$("#theme").onclick=()=>{const r=document.documentElement,d=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=d?"light":"dark"};
</script>
</body>
</html>
